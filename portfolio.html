<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あさな | ポートフォリオ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0c0c0c !important;
      color: #e8e0d5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      line-height: 1.8;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 10%, rgba(201, 169, 110, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(245, 230, 200, 0.04) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      background: rgba(12, 12, 12, 0.95);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2520;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #f5e6c8;
      margin: 0;
    }
    header a {
      color: #c9a96e;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }
    header a:hover { color: #f5e6c8; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 40px;
      position: relative;
      z-index: 1;
    }

    h2 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #f5e6c8;
      margin-bottom: 40px;
    }
    h2::after {
      content: "";
      display: block;
      width: 40px;
      height: 1px;
      background: #c9a96e;
      margin: 16px auto 0;
      opacity: 0.7;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 50px;
    }
    .cat-btn {
      padding: 10px 22px;
      border: 1px solid #2a2520;
      background: transparent;
      color: #a89a85;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    .cat-btn:hover,
    .cat-btn.active {
      border-color: #c9a96e;
      color: #c9a96e;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border: 1px solid #2a2520;
      background: #141210;
      cursor: pointer;
      transition: all 0.4s ease;
    }
    .gallery-item img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
      filter: brightness(0.9);
    }
    .gallery-item:hover img {
      transform: scale(1.08);
    }
    .gallery-item:hover {
      border-color: #c9a96e;
      box-shadow: 0 10px 30px rgba(201, 169, 110, 0.12);
    }
    .gallery-item .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      padding: 20px 14px 14px;
      color: #f5e6c8;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .gallery-item:hover .caption {
      opacity: 1;
    }
    .gallery-item.hide {
      display: none;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: #141210;
      border: 1px solid #2a2520;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #c9a96e;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
      line-height: 1;
    }
    .modal-close:hover { color: #f5e6c8; }
    .modal-image {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      background: #0c0c0c;
    }
    .modal-body {
      padding: 28px 32px 36px;
    }
    .modal-title {
      font-size: 1.25rem;
      color: #f5e6c8;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      font-weight: 400;
    }
    .modal-text {
      color: #c8bba8;
      font-size: 0.95rem;
      line-height: 1.9;
      margin-bottom: 24px;
    }
    .modal-links a {
      display: inline-block;
      margin-right: 18px;
      margin-bottom: 8px;
      color: #c9a96e;
      border-bottom: 1px solid transparent;
      transition: all 0.25s;
    }
    .modal-links a:hover {
      color: #f5e6c8;
      border-bottom-color: #c9a96e;
    }

    /* 連絡先セクション */
    .contact-section {
      max-width: 800px;
      margin: 80px auto 0;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }
    .contact-box {
      background: #141210;
      border: 1px solid #2a2520;
      padding: 40px 36px;
      text-align: center;
    }
    .contact-box h3 {
      font-size: 1.15rem;
      color: #f5e6c8;
      letter-spacing: 0.12em;
      font-weight: 400;
      margin-bottom: 28px;
    }
    .contact-accounts {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .contact-accounts a {
      color: #c8bba8;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      border-bottom: 1px solid transparent;
      transition: all 0.25s;
    }
    .contact-accounts a:hover {
      color: #c9a96e;
      border-bottom-color: #c9a96e;
    }
    .contact-email {
      color: #c9a96e;
      font-size: 1rem;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }
    .contact-note {
      color: #8a8070;
      font-size: 0.88rem;
      line-height: 1.9;
      text-align: left;
      max-width: 520px;
      margin: 0 auto;
    }

    footer {
      text-align: center;
      padding: 50px 20px 40px;
      color: #6a6055;
      font-size: 0.85rem;
      border-top: 1px solid #1f1c18;
      margin-top: 60px;
    }
    footer a {
      color: #8a8070;
      margin: 0 12px;
      text-decoration: none;
    }
    footer a:hover { color: #c9a96e; }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .gallery-item img { height: 180px; }
      .modal-body { padding: 20px; }
      .contact-box { padding: 30px 20px; }
    }
  </style>
</head>
<body>

      <div class="modal-body">

  <script>
    const buttons = document.querySelectorAll('.cat-btn');
    const items = document.querySelectorAll('.gallery-item');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        items.forEach(item => {
          if (cat === 'all' || item.dataset.cat === cat) {
            item.classList.remove('hide');
          } else {
            item.classList.add('hide');
          }
        });
      });
    });

    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalLinks = document.getElementById('modalLinks');
    const modalClose = document.getElementById('modalClose');

    items.forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        modalImage.src = img.src;
        modalTitle.textContent = item.dataset.title || '';
        modalText.textContent = item.dataset.text || '';

        modalLinks.innerHTML = '';
        if (item.dataset.link1 && item.dataset.link1 !== '#') {
          const a1 = document.createElement('a');
          a1.href = item.dataset.link1;
          a1.target = '_blank';
          a1.textContent = item.dataset.link1text || 'リンク1';
          modalLinks.appendChild(a1);
        }
        if (item.dataset.link2 && item.dataset.link2 !== '') {
          const a2 = document.createElement('a');
          a2.href = item.dataset.link2;
          a2.target = '_blank';
          a2.textContent = item.dataset.link2text || 'リンク2';
          modalLinks.appendChild(a2);
        }

        modal.classList.add('open');
      });
    });

    modalClose.addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    });
  </script>
